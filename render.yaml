services:
  - type: web
    name: student-management
    runtime: docker
    repo: https://github.com/DemonQuang/Student_Management.git
    branch: master
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
